; ; ---- development, flashed over WiFi (OTA) ------------------------------------
; ; 1) Set the password once per terminal session (never write it in this file). It is the
; ;    OTA_PASSWORD from secrets.h (or "12345678", the debug fallback, if secrets.h has none):
; ;      PowerShell:  $env:HIVE_OTA_PASSWORD = "<OTA_PASSWORD>"
; ; 2) Pick ONE way to reach the board:
; ;      esp32dev_ota_ap : join the board's own WiFi ("HiveMonitor"), upload to 192.168.4.1.
; ;                        Most reliable, works anywhere, no router or mDNS involved.
; ;      esp32dev_ota    : PC and board on the same router. Uses the hostname; if it does not
; ;                        resolve on Windows, put the "STA IP" from the serial log instead.
; ;    Then:  pio run -e esp32dev_ota_ap -t upload
; ; Windows Firewall: the board connects BACK to your PC during the transfer. If you get
; ; "No response from device" or a timeout, allow python.exe through the firewall, or pin the
; ; return port (--host_port below) and open that port for inbound TCP.
; [env:esp32dev_ota_ap]
; extends = env:esp32dev
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags =
;     --port=3232
;     --host_port=45678
;     --auth=${sysenv.HIVE_OTA_PASSWORD}

; [env:esp32dev_ota]
