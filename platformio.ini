; ============================================================================
;  Hive monitor firmware
;    pio run -t upload            -> development build (HIVE_DEBUG=1)   [default]
;    pio run -e release -t upload -> production build (HIVE_DEBUG=0)
;    pio device monitor           -> serial console
; ============================================================================

[platformio]
default_envs = esp32dev

; ---- shared by every environment -------------------------------------------
[env]
; Pinned so a library/core update cannot change behaviour under you.
; 6.9.0 = Arduino-ESP32 core 2.0.17. Check yours with `pio pkg list` before changing it.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ~1.9 MB app slot (default.csv only gives ~1.25 MB, which this firmware with TLS can
; outgrow). The firmware uses the SD card, not SPIFFS.
; NOTE: changing the partition table needs ONE full USB flash.
board_build.partitions = min_spiffs.csv

lib_deps =
    beegee-tokyo/DHT sensor library for ESPx@^1.19   ; DHTesp (DHT22)
    adafruit/RTClib@^2.1.4                           ; DS3231
    adafruit/Adafruit INA219@^1.2.3                  ; battery / solar monitor
    adafruit/Adafruit BusIO@^1.16.0                  ; dependency of the two above

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Local dashboard access point (read by connection.cpp). Change before deployment:
    ; -DHIVE_AP_SSID=\"Hive-A1\"
    ; -DHIVE_AP_PASS=\"a-long-random-pass\"

; ---- development: debug logging ON (default) --------------------------------
[env:esp32dev]
build_type = debug
build_flags =
    ${env.build_flags}
    -DHIVE_DEBUG=1
monitor_filters = esp32_exception_decoder, time

; ---- production -------------------------------------------------------------
[env:release]
build_flags =
    ${env.build_flags}
    -DHIVE_DEBUG=0